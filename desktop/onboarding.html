<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self'" />
    <title data-i18n="setup.title"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="flow.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <!-- "Your own server" in the flow look (DESIGN.md), on the web's own parts: flow.css is web/src/ui/flow/flow.css,
       copied by npm run design, so the classes are the ones web/src/ui/flow/Flow.tsx renders. onboarding.css has only
       what this window has and the web doesn't (the drum, the DNS records, the Drive row). -->
  <body>
    <div class="flow">
    <div class="flow-col">
      <div class="flow-ruler" id="ruler" aria-hidden="true"></div>
      <p class="flow-label" id="stage"></p>

      <main id="steps">
        <!-- 1. Getting in: the address and password the hosting company e-mailed. -->
        <form class="step flow-step flow-swap" data-step="server" id="f-server" autocomplete="off" hidden>
          <h1 class="flow-title" data-i18n="ob.server.h"></h1>
          <p class="flow-sub" data-i18n="ob.server.sub"></p>
          <div class="flow-body">
            <div class="flow-pair">
              <label class="flow-field">
                <span class="flow-field-label" data-i18n="ob.ip"></span>
                <span class="flow-line"><input class="input" id="ip" placeholder="203.0.113.10" spellcheck="false" autocapitalize="off" /></span>
              </label>
              <!-- The login is almost always root, so it's filled in; it's in plain sight, next to the address. -->
              <label class="flow-field">
                <span class="flow-field-label" data-i18n="ob.login"></span>
                <span class="flow-line"><input class="input" id="user" value="root" spellcheck="false" autocapitalize="off" /></span>
              </label>
            </div>
            <label class="flow-field">
              <span class="flow-field-label" data-i18n="ob.password"></span>
              <span class="flow-line">
                <input class="input" id="pass" type="password" spellcheck="false" data-i18n-attr="placeholder:ob.passwordHint" />
                <button class="eye" id="eye" type="button" data-i18n-attr="aria-label:ob.showPassword">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </span>
            </label>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-server" role="alert"></p>
            <div class="flow-buttons">
              <button class="primary flow-primary" type="submit" id="go-server" disabled data-i18n="ob.connect"></button>
            </div>
          </div>
        </form>

        <!-- 2. The address people will open: a free deSEC name, or a domain of one's own. -->
        <section class="step flow-step flow-swap" data-step="address" hidden>
          <h1 class="flow-title" data-i18n="ob.address.h"></h1>
          <p class="flow-sub" data-i18n="ob.address.sub"></p>
          <div class="flow-body">
            <div role="radiogroup" data-i18n-attr="aria-label:ob.address.aria">
              <button class="choice flow-radio" type="button" role="radio" aria-checked="true" data-pick="free">
                <span class="flow-radio-text"><span class="flow-radio-title" data-i18n="ob.free"></span><span class="flow-radio-sub" data-i18n="ob.freeSub"></span></span>
                <span class="flow-radio-dot"></span>
              </button>
              <button class="choice flow-radio last" type="button" role="radio" aria-checked="false" data-pick="own">
                <span class="flow-radio-text"><span class="flow-radio-title" data-i18n="ob.own"></span><span class="flow-radio-sub" data-i18n="ob.ownSub"></span></span>
                <span class="flow-radio-dot"></span>
              </button>
            </div>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <div class="flow-buttons">
              <button class="back flow-back" type="button" data-i18n-attr="aria-label:ob.back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
              <button class="primary flow-primary" type="button" id="go-address" data-i18n="ob.next"></button>
            </div>
          </div>
        </section>

        <!-- 2a. A free address on deSEC (name.dedyn.io): name and e-mail here, then the letter. The app makes the deSEC
             account (its password stays in the app); deSEC's page behind the link asks the captcha and activates it;
             the app sees that and points the name here. -->
        <section class="step flow-step flow-swap" data-step="free-name" hidden>
          <h1 class="flow-title" data-i18n="ob.free"></h1>
          <p class="flow-sub" data-i18n="ob.free.sub"></p>
          <div class="flow-body">
            <div class="kept" id="saved" hidden>
              <span id="saved-name"></span>
              <button class="flow-text-action" type="button" id="use-saved" data-i18n="ob.useSaved"></button>
            </div>
            <p class="flow-error" id="e-saved" role="alert"></p>
            <label class="flow-field">
              <span class="flow-field-label" data-i18n="ob.name"></span>
              <span class="flow-line"><input class="input" id="free-name" placeholder="podval" spellcheck="false" autocapitalize="off" /><span class="flow-suffix">.dedyn.io</span></span>
            </label>
            <label class="flow-field">
              <span class="flow-field-label" data-i18n="ob.email"></span>
              <span class="flow-line"><input class="input" id="free-email" type="email" placeholder="you@gmail.com" spellcheck="false" autocapitalize="off" /></span>
            </label>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-free-name" role="alert"></p>
            <div class="flow-buttons">
              <button class="back flow-back" type="button" data-i18n-attr="aria-label:ob.back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
              <button class="primary flow-primary" type="button" id="go-free-name" disabled data-i18n="ob.next"></button>
            </div>
          </div>
        </section>

        <section class="step flow-step flow-swap" data-step="free-mail" hidden>
          <h1 class="flow-title" data-i18n="ob.mail.h"></h1>
          <p class="flow-sub" data-i18n="ob.mail.sub"></p>
          <div class="flow-body">
            <div>
              <p class="flow-big" id="mail-to">you@gmail.com</p>
              <p class="wait" id="mail-wait"><span class="spinner"></span><span id="mail-state" data-i18n="ob.mail.waiting"></span></p>
              <p class="late" id="mail-late" hidden data-i18n="ob.mail.late"></p>
            </div>
            <p class="flow-note" data-i18n="ob.mail.spam"></p>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-mail" role="alert"></p>
            <div class="flow-buttons">
              <button class="primary flow-primary" type="button" id="open-mail" hidden><span id="open-mail-label" data-i18n="ob.mail.open"></span></button>
              <button class="flow-secondary" type="button" id="other-mail" data-i18n="ob.mail.other"></button>
              <button class="flow-secondary" type="button" id="own-instead" hidden data-i18n="ob.own"></button>
            </div>
          </div>
        </section>

        <!-- 2b. A domain of one's own: the three records to add at the registrar, checked before going on. -->
        <section class="step flow-step flow-swap" data-step="own" hidden>
          <h1 class="flow-title" data-i18n="ob.own"></h1>
          <p class="flow-sub" data-i18n="ob.own.sub"></p>
          <div class="flow-body">
            <label class="flow-field">
              <span class="flow-field-label" data-i18n="ob.domain"></span>
              <span class="flow-line"><input class="input" id="domain" placeholder="chat.example.com" spellcheck="false" autocapitalize="off" /></span>
            </label>
            <div class="records" id="records" hidden></div>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-own" role="alert"></p>
            <div class="flow-buttons">
              <button class="back flow-back" type="button" data-i18n-attr="aria-label:ob.back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
              <button class="primary flow-primary" type="button" id="go-own" disabled data-i18n="ob.check"></button>
            </div>
          </div>
        </section>

        <!-- 3. Backups away from the server: a nightly encrypted copy on the admin's Google Drive. -->
        <section class="step flow-step flow-swap" data-step="backup" hidden>
          <h1 class="flow-title" data-i18n="ob.backup.h"></h1>
          <p class="flow-sub" data-i18n="ob.backup.sub"></p>
          <div class="flow-body">
            <div class="drive">
              <span class="grow"><b data-i18n="ob.drive"></b><small id="drive-sub" data-i18n="ob.driveSub"></small></span>
              <button class="flow-text-action" type="button" id="drive-connect" data-i18n="ob.connect"></button>
              <span class="on" id="drive-on" hidden data-i18n="ob.driveOn"></span>
            </div>
            <!-- What a copy saves you from, not what it is. -->
            <ul class="points">
              <li><b data-i18n="ob.backup.b1"></b><small data-i18n="ob.backup.b1sub"></small></li>
              <li><b data-i18n="ob.backup.b2"></b><small data-i18n="ob.backup.b2sub"></small></li>
              <li><b data-i18n="ob.backup.b3"></b><small data-i18n="ob.backup.b3sub"></small></li>
            </ul>
          </div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-backup" role="alert"></p>
            <div class="flow-buttons">
              <button class="back flow-back" type="button" data-i18n-attr="aria-label:ob.back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
              <button class="primary flow-primary" type="button" id="go-backup" disabled data-i18n="ob.next"></button>
              <button class="flow-secondary" type="button" id="skip-backup" data-i18n="ob.backup.skip"></button>
            </div>
          </div>
        </section>

        <!-- 4. The install itself, step by step; nothing to press. -->
        <section class="step flow-step flow-swap" data-step="install" hidden>
          <h1 class="flow-title" id="install-title" data-i18n="ob.install.title"></h1>
          <p class="flow-sub" id="install-sub" data-i18n="ob.install.sub"></p>
          <!-- The installer's steps on a drum: the one that is on in the middle, the ones done above, the next below. -->
          <div class="wheel"><ol class="tasks" id="tasks"></ol></div>
          <div class="flow-spacer"></div>
          <div class="flow-foot">
            <p class="flow-error" id="e-install" role="alert"></p>
            <div class="flow-buttons">
              <button class="primary flow-primary" type="button" id="go-install" disabled data-i18n="ob.install.open"></button>
              <button class="primary flow-primary" type="button" id="retry" hidden data-i18n="ob.install.retry"></button>
            </div>
          </div>
        </section>
      </main>
    </div>
    </div>
    <script src="i18n.js"></script>
    <script src="i18n-page.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
