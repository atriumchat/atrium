<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Gomex</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0b0d;
        color: #f2f2f4;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 6px;
        max-width: 360px;
        text-align: center;
      }
      svg {
        width: 44px;
        height: 44px;
        margin-bottom: 14px;
        color: #5b5b66;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
      }
      #host {
        color: #9a9aa3;
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .again {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: #6f6f78;
        font-size: 13px;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 1.5px solid #ffffff26;
        border-top-color: #9a9aa3;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        height: 38px;
        margin-top: 22px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #f2f2f4;
        color: #0b0b0d;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #ffffff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 164 164" aria-hidden="true">
        <circle cx="82" cy="82" r="71.97" fill="none" stroke="currentColor" stroke-width="13.7" />
        <path fill="currentColor" d="M116.1 78V120.9H107.1L105 111.3Q95.4 122.8 80 122.8Q63.1 122.8 52.5 111.3Q42 99.8 42 81.3Q42 63.2 52.6 51.1Q63.2 39 81.2 39Q94.3 39 104 46.3Q113.7 53.6 115.1 66.3H101.5Q100.2 59 94.8 54.9Q89.3 50.8 81.1 50.8Q69.5 50.8 62.8 58.9Q56.2 67 56.2 81.1Q56.2 95.3 62.9 103.4Q69.6 111.4 81.5 111.4Q92 111.4 97.7 104.9Q103.4 98.4 103.4 88.8H81.8V78Z" />
      </svg>
      <h1>Сервер не открывается</h1>
      <span id="host"></span>
      <span class="again"><span class="spinner"></span>Пробуем снова каждые 5 секунд</span>
      <button id="retry" type="button">Повторить</button>
    </main>
    <script src="unreachable.js"></script>
  </body>
</html>
