<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; img-src data:; script-src 'self'" />
    <title data-i18n="picker.title"></title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header>
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-window" type="button" role="tab" aria-selected="true" data-i18n="picker.windows"></button>
        <button class="tab" id="tab-screen" type="button" role="tab" aria-selected="false" data-i18n="picker.screens"></button>
      </div>
    </header>
    <main>
      <div class="grid" id="window" role="listbox" aria-labelledby="tab-window"></div>
      <div class="grid" id="screen" role="listbox" aria-labelledby="tab-screen" hidden></div>
      <p class="note" id="note" hidden></p>
      <span class="spinner" id="wait" role="status" data-i18n-attr="aria-label:picker.loading"></span>
    </main>
    <footer>
      <!-- Only Windows can share the computer's sound with the screen. -->
      <button class="switch" id="sound" type="button" role="switch" aria-checked="true" hidden>
        <i class="track"></i>
        <span data-i18n="picker.sound"></span>
      </button>
      <span class="spacer"></span>
      <button class="quiet" id="cancel" type="button" data-i18n="picker.cancel"></button>
      <button class="primary" id="show" type="button" disabled data-i18n="picker.share"></button>
    </footer>
    <script src="i18n.js"></script>
    <script src="i18n-page.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
